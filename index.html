<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MisterVitaminas - Catálogo de Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'olive-green': '#556B2F', /* Verde Oliva principal */
                        'accent-orange': '#F97316', /* Naranja de acento (Tailwind orange-500) */
                        'accent-orange-hover': '#EA580C', /* Naranja hover (Tailwind orange-600) */
                        'light-bg': '#F9FAFB', /* Fondo claro */
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
        }

        /* Prevent scrolling when modal is open */
        body.modal-open {
            overflow: hidden;
        }

        /* Cart Sidebar Animation */
        #cart-sidebar {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }

        #cart-sidebar.open {
            transform: translateX(0);
        }

        /* Fade overlay animation */
        #cart-overlay, #product-modal-overlay {
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }

        #cart-overlay.open, #product-modal-overlay.open {
            opacity: 0.5;
            pointer-events: auto;
        }

        /* Product Modal Animation */
        #product-modal {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        #product-modal.open {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        
        /* Subtle hover effect for product cards */
        .product-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer; /* Indicate it's clickable */
        }

        #cart-overlay.open {
            opacity: 0.5;
            pointer-events: auto;
        }
        
        /* Subtle hover effect for product cards */
        .product-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Ocultar barra de scroll en contenedor de filtros (móvil) */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-light-bg text-gray-800 flex flex-col min-h-screen">

    <header class="bg-olive-green text-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-leaf text-2xl text-accent-orange"></i>
                <h1 class="text-2xl font-bold tracking-tight">Mister<span class="text-accent-orange">Vitaminas</span></h1>
            </div>
            
            <!-- Cart Button in Header -->
            <button id="open-cart-btn" class="relative p-2 text-white hover:text-accent-orange transition-colors focus:outline-none">
                <i class="fa-solid fa-shopping-cart text-xl"></i>
                <span id="cart-badge" class="absolute top-0 right-0 -mt-1 -mr-1 bg-accent-orange text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
            </button>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8">
        
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">Nuestros Productos</h2>
            <p class="text-gray-600">Suplementos de calidad para tu bienestar.</p>
        </div>

        <div class="flex flex-col md:flex-row gap-8">
            
            <!-- Barra Lateral Izquierda: Filtros -->
            <aside class="w-full md:w-1/4 lg:w-1/5 shrink-0">
                <h3 class="text-lg font-bold text-gray-800 mb-4 hidden md:block"><i class="fa-solid fa-filter mr-2 text-accent-orange"></i>Categorías</h3>
                <!-- En móviles este contenedor hace "scroll" horizontal, en escritorio se apila verticalmente -->
                <div class="flex flex-row md:flex-col gap-2 md:gap-3 overflow-x-auto pb-2 md:pb-0 hide-scrollbar">
                    <button onclick="aplicarFiltro('todos')" data-categoria="todos" class="filter-btn bg-olive-green text-white border border-olive-green px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-colors text-left flex items-center shadow-sm">
                        <span>Todos los productos</span>
                    </button>
                    <button onclick="aplicarFiltro('hombre')" data-categoria="hombre" class="filter-btn bg-white text-gray-700 hover:bg-gray-100 border border-gray-200 px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-colors text-left flex items-center shadow-sm">
                        <span>Productos Hombre</span>
                    </button>
                    <button onclick="aplicarFiltro('mujer')" data-categoria="mujer" class="filter-btn bg-white text-gray-700 hover:bg-gray-100 border border-gray-200 px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-colors text-left flex items-center shadow-sm">
                        <span>Productos Mujer</span>
                    </button>
                    <button onclick="aplicarFiltro('niños')" data-categoria="niños" class="filter-btn bg-white text-gray-700 hover:bg-gray-100 border border-gray-200 px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-colors text-left flex items-center shadow-sm">
                        <span>Productos Niños</span>
                    </button>
                </div>
            </aside>

            <!-- Área Principal: Buscador y Grilla -->
            <div class="w-full md:w-3/4 lg:w-4/5">
                
                <!-- Barra de Búsqueda Superior -->
                <div class="relative mb-6">
                    <i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
                    <input type="text" id="buscador-productos" placeholder="Buscar suplementos, vitaminas, descripciones..." class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-olive-green focus:border-transparent shadow-sm transition-shadow text-gray-700 text-base">
                </div>

                <!-- Product Grid Container -->
                <div id="product-grid" class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                    <!-- Products will be injected here by JavaScript -->
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-olive-green text-white py-6 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="mb-2">&copy; 2026 MisterVitaminas. Todos los derechos reservados.</p>
            <p class="text-sm text-gray-300">Contactanos por WhatsApp para más información.</p>
        </div>
    </footer>

    <div id="cart-overlay" class="fixed inset-0 bg-black z-40"></div>

    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl z-50 flex flex-col">
        
        <!-- Cart Header -->
        <div class="flex justify-between items-center p-4 border-b bg-gray-50">
            <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-cart-shopping mr-2 text-olive-green"></i>Tu Carrito</h2>
            <button id="close-cart-btn" class="text-gray-500 hover:text-red-500 focus:outline-none p-2 rounded-full hover:bg-gray-200 transition-colors">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
        </div>

        <!-- Cart Items Container -->
        <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-4">
            <!-- Cart items will be injected here -->
            <div id="empty-cart-message" class="text-center text-gray-500 mt-10">
                <i class="fa-solid fa-basket-shopping text-4xl mb-3 text-gray-300"></i>
                <p>Tu carrito está vacío.</p>
            </div>
        </div>

        <!-- Cart Footer / Checkout -->
        <div class="border-t p-4 bg-gray-50">
            <div class="flex justify-between items-center mb-4">
                <span class="text-lg font-semibold text-gray-700">Total:</span>
                <span id="cart-total" class="text-2xl font-bold text-olive-green">$0.00</span>
            </div>
            <button id="checkout-btn" class="w-full bg-accent-orange hover:bg-accent-orange-hover text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors flex items-center justify-center gap-2 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <i class="fa-brands fa-whatsapp text-xl"></i>
                Comprar por WhatsApp
            </button>
        </div>
    </div>

    <!-- Product Details Modal -->
    <div id="product-modal-overlay" class="fixed inset-0 bg-black z-40"></div>
    <div id="product-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col md:flex-row relative">
            
            <!-- Close Button -->
            <button id="close-modal-btn" class="absolute top-3 right-3 bg-white bg-opacity-80 rounded-full p-2 text-gray-500 hover:text-red-500 z-10 transition-colors focus:outline-none">
                <i class="fa-solid fa-times text-xl"></i>
            </button>

            <!-- Modal Content (will be injected) -->
            <div id="modal-content" class="flex flex-col md:flex-row w-full h-full overflow-y-auto">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script>
        /**
         * ==========================================
         * 1. GESTIÓN DE PRODUCTOS (EDITAR AQUÍ)
         * ==========================================
         * Modifica este Array para cambiar precios, nombres, descripciones o imágenes.
         * 
         * Estructura de cada producto:
         * - id: Identificador único (número).
         * - etiqueta: "hombre", "mujer", "niños". Úsala para que el filtro funcione.
         * - nombre: Nombre del producto (texto).
         * - descripcion_breve: Una línea corta describiendo el producto (texto).
         * - descripcion_detallada: Descripción extensa para mostrar en la ventana flotante.
         * - precio: Valor numérico usando punto para decimales (ej. 15.50).
         * - url_imagen: URL de la foto del producto. Puedes usar URLs externas o locales.
         */
        const productos = [
            {
                id: 4,
                etiqueta: ["mujer", "hombre"],
                nombre: "NOMBRE DE TU PRODUCTO AQUÍ",
                descripcion_breve: "Escribe aquí una breve descripción del producto de tu imagen.",
                descripcion_detallada: "Esta es la descripción detallada del producto. Aquí puedes explicar los beneficios completos, dosis recomendada, ingredientes, y cualquier otra información importante para tus clientes.",
                precio: 25.00,
                url_imagen: "imagenes/imagen_producto_4.jpg"
            },
            {
                id: 1,
                etiqueta: "mujer",
                nombre: "Nature's Truth, Women's Care, Probiotic-22",
                descripcion_breve: "Con Arándano y D-Manosa, 30 Mil Millones UFC. 33 Cápsulas Veganas.",
                descripcion_detallada: "Este probiótico restaurador formulado por médicos proporciona apoyo específico para la salud digestiva y vaginal. Contiene 30 mil millones de UFC y 18 cepas vivas para apoyar un equilibrio saludable de la microflora. También incluye arándano concentrado de primera calidad con proantocianidinas (PAC) de origen natural y D-Manosa para ayudar a las defensas naturales del cuerpo. No requiere refrigeración.",
                precio: 18.49,
                url_imagen: "imagenes/Vitamin D3 125MCG.jpg" 
            },
            {
                id: 2,
                etiqueta: ["hombre", "mujer", "niños"],
                nombre: "Vitamatic, Vitamina D3, 1250 mcg (50,000 UI)",
                descripcion_breve: "Apoyo óseo e inmunológico. Toma semanal. 60 Cápsulas Vegetales.",
                descripcion_detallada: "Vitamatic Vitamina D3 es un nutriente muy importante para el funcionamiento muscular saludable en general, aumenta la absorción de calcio para tener huesos y dientes más fuertes y favorece el sistema inmunológico. Formulada para tomarse solo una vez a la semana. Todos los beneficios de la vitamina D sin el riesgo de exposición sin protección a los rayos UVB.",
                precio: 9.99,
                url_imagen: "imagenes/imagen_producto_2.jpg"
            },
            {
                id: 3,
                etiqueta: "niños",
                nombre: "Force Factor, Complejo B",
                descripcion_breve: "Metabolismo energético y salud del corazón. 60 Cápsulas Vegetales.",
                descripcion_detallada: "Complejo B con 8 vitaminas B esenciales formulado para apoyar el metabolismo energético y la salud del corazón. Ayuda a convertir los alimentos en energía celular y apoya la salud del sistema nervioso. Fórmula vegana, sin gelatina y Non-GMO. Contiene Tiamina, Riboflavina, Niacina, Vitamina B6, Folato, Vitamina B-12, Biotina y Ácido Pantoténico.",
                precio: 5.99,
                url_imagen: "imagenes/imagen_producto_3.jpg"
            },
            
        ];

        /**
         * ==========================================
         * 2. LÓGICA DE ESTADO (CARRITO Y FILTROS)
         * ==========================================
         */
        let carrito = []; 
        let filtroActual = 'todos'; // Puede ser: 'todos', 'hombre', 'mujer', 'niños'
        let busquedaActual = '';

        // Elementos del DOM
        const productGrid = document.getElementById('product-grid');
        const buscadorInput = document.getElementById('buscador-productos');
        const checkoutBtn = document.getElementById('checkout-btn');
        
        // Elementos del Modal de Producto
        const productModal = document.getElementById('product-modal');
        const productModalOverlay = document.getElementById('product-modal-overlay');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalContent = document.getElementById('modal-content');

        // Elementos del Carrito (Nuevos)
        const openCartBtn = document.getElementById('open-cart-btn');
        const closeCartBtn = document.getElementById('close-cart-btn');
        const cartOverlay = document.getElementById('cart-overlay');
        const cartSidebar = document.getElementById('cart-sidebar');
        const cartItemsContainer = document.getElementById('cart-items');
        const emptyCartMessage = document.getElementById('empty-cart-message');
        const cartTotalEl = document.getElementById('cart-total');
        const cartBadge = document.getElementById('cart-badge');

        const body = document.body;

        // Configuración de WhatsApp
        const numeroWhatsApp = "5930964232272"; // Número proporcionado

        /**
         * ==========================================
         * 3. RENDERIZADO DEL CATÁLOGO
         * ==========================================
         */
        function renderProductos() {
            productGrid.innerHTML = ''; // Limpiar grilla

            // Filtrar productos combinando Búsqueda y Categoría
            const productosFiltrados = productos.filter(producto => {
                // 1. Validar barra de búsqueda
                const termino = busquedaActual.toLowerCase();
                const coincideBusqueda = producto.nombre.toLowerCase().includes(termino) || 
                                         producto.descripcion_breve.toLowerCase().includes(termino);
                
                // 2. Validar barra lateral (Soporte para múltiples etiquetas)
                let etiquetasDelProducto = [];
                
                // Verificamos si la etiqueta es un Array (ej: ["hombre", "mujer"]) o un texto simple (ej: "mujer")
                if (Array.isArray(producto.etiqueta)) {
                    etiquetasDelProducto = producto.etiqueta.map(e => e.toLowerCase());
                } else if (typeof producto.etiqueta === 'string') {
                    etiquetasDelProducto = [producto.etiqueta.toLowerCase()];
                }

                // El producto coincide si estamos en "todos" o si el array de etiquetas incluye el filtro actual
                const coincideFiltro = filtroActual === 'todos' || etiquetasDelProducto.includes(filtroActual);

                return coincideBusqueda && coincideFiltro;
            });

            // Mostrar mensaje si no hay resultados
            if (productosFiltrados.length === 0) {
                productGrid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-16 text-gray-500">
                        <i class="fa-solid fa-magnifying-glass text-4xl mb-4 text-gray-300"></i>
                        <p class="text-lg">No encontramos productos que coincidan con tu búsqueda.</p>
                    </div>
                `;
                return;
            }

            // Renderizar las tarjetas filtradas
            productosFiltrados.forEach(producto => {
                const card = document.createElement('div');
                card.className = 'product-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-full';
                // Añadimos el evento onclick a la tarjeta entera para abrir el modal
                card.onclick = () => abrirModalProducto(producto.id);
                
                card.innerHTML = `
                    <div class="relative w-full pb-[100%] bg-white border-b border-gray-50"> <!-- Aspect ratio 1:1 -->
                        <img src="${producto.url_imagen}" alt="${producto.nombre}" class="absolute inset-0 w-full h-full object-contain p-4 sm:p-8" onerror="this.src='https://placehold.co/400x400/e2e8f0/64748b?text=Imagen+No+Disponible'">
                    </div>
                    <div class="p-3 sm:p-5 flex flex-col flex-grow">
                        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-2 gap-1 sm:gap-0">
                            <h3 class="text-sm sm:text-lg font-bold text-gray-900 leading-tight line-clamp-2 sm:line-clamp-none">${producto.nombre}</h3>
                            <span class="text-base sm:text-lg font-black text-olive-green whitespace-nowrap">$${producto.precio.toFixed(2)}</span>
                        </div>
                        <p class="text-xs sm:text-sm text-gray-500 mb-3 sm:mb-4 flex-grow line-clamp-2 sm:line-clamp-3">${producto.descripcion_breve}</p>
                        <!-- Detenemos la propagación del click en el botón para que no abra el modal y solo añada al carrito -->
                        <button onclick="event.stopPropagation(); agregarAlCarrito(${producto.id})" class="w-full bg-accent-orange hover:bg-accent-orange-hover text-white font-medium py-1.5 sm:py-2 px-2 sm:px-4 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-1 sm:gap-2 text-sm sm:text-base">
                            <i class="fa-solid fa-cart-plus"></i> <span class="hidden sm:inline">Agregar</span>
                        </button>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        /**
         * ==========================================
         * 3.2 LÓGICA DE EVENTOS (BUSCADOR Y FILTROS)
         * ==========================================
         */
        buscadorInput.addEventListener('input', (e) => {
            busquedaActual = e.target.value;
            renderProductos();
        });

        function aplicarFiltro(categoria) {
            filtroActual = categoria;
            
            // Actualizar botones visualmente para mostrar cuál está activo
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.categoria === categoria) {
                    // Estilo Activo
                    btn.classList.add('bg-olive-green', 'text-white', 'border-olive-green');
                    btn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
                } else {
                    // Estilo Inactivo
                    btn.classList.remove('bg-olive-green', 'text-white', 'border-olive-green');
                    btn.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
                }
            });
            
            // Volver a dibujar los productos
            renderProductos();
        }

        /**
         * ==========================================
         * 3.5 RENDERIZADO Y MANEJO DEL MODAL DE PRODUCTO
         * ==========================================
         */
        
        function abrirModalProducto(idProducto) {
            const producto = productos.find(p => p.id === idProducto);
            if (!producto) return;

            // Construir el contenido del modal
            modalContent.innerHTML = `
                <div class="w-full md:w-1/2 bg-white p-6 md:p-10 flex items-center justify-center border-b md:border-b-0 md:border-r border-gray-100">
                    <img src="${producto.url_imagen}" alt="${producto.nombre}" class="w-full h-56 sm:h-72 md:h-96 object-contain drop-shadow-md" onerror="this.src='https://placehold.co/400x400/e2e8f0/64748b?text=Imagen+No+Disponible'">
                </div>
                <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col">
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">${producto.nombre}</h2>
                    <p class="text-3xl font-black text-olive-green mb-4">$${producto.precio.toFixed(2)}</p>
                    
                    <div class="mb-6 flex-grow">
                        <h4 class="font-semibold text-gray-800 mb-2 text-sm uppercase tracking-wider">Descripción</h4>
                        <p class="text-gray-600 text-sm md:text-base leading-relaxed">
                            ${producto.descripcion_detallada || producto.descripcion_breve}
                        </p>
                    </div>

                    <button onclick="agregarAlCarrito(${producto.id}); cerrarModalProducto();" class="w-full bg-accent-orange hover:bg-accent-orange-hover text-white font-bold py-3 px-4 rounded-xl shadow-md transition-colors flex items-center justify-center gap-2 mt-auto">
                        <i class="fa-solid fa-cart-plus text-lg"></i> Agregar al carrito
                    </button>
                </div>
            `;

            productModal.classList.add('open');
            productModalOverlay.classList.add('open');
            body.classList.add('modal-open');
        }

        function cerrarModalProducto() {
            productModal.classList.remove('open');
            productModalOverlay.classList.remove('open');
            // Solo remover la clase modal-open si el carrito NO está abierto
            if (!cartSidebar.classList.contains('open')) {
                body.classList.remove('modal-open');
            }
        }

        closeModalBtn.addEventListener('click', cerrarModalProducto);
        productModalOverlay.addEventListener('click', cerrarModalProducto);


        /**
         * ==========================================
         * 4. FUNCIONALIDAD DEL CARRITO
         * ==========================================
         */
        
        function agregarAlCarrito(idProducto) {
            const producto = productos.find(p => p.id === idProducto);
            if (!producto) return;

            const itemExistente = carrito.find(item => item.id === idProducto);

            if (itemExistente) {
                itemExistente.cantidad += 1;
            } else {
                carrito.push({
                    ...producto,
                    cantidad: 1
                });
            }

            actualizarCarritoUI();
            abrirCarrito(); // Opcional: Abrir el sidebar al agregar
        }

        function modificarCantidad(idProducto, cambio) {
            const index = carrito.findIndex(item => item.id === idProducto);
            if (index !== -1) {
                carrito[index].cantidad += cambio;
                if (carrito[index].cantidad <= 0) {
                    carrito.splice(index, 1); // Eliminar si la cantidad llega a 0
                }
                actualizarCarritoUI();
            }
        }

        function eliminarDelCarrito(idProducto) {
            carrito = carrito.filter(item => item.id !== idProducto);
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            // Limpiar items
            cartItemsContainer.innerHTML = '';
            let total = 0;
            let totalItems = 0;

            if (carrito.length === 0) {
                cartItemsContainer.appendChild(emptyCartMessage);
                emptyCartMessage.style.display = 'block';
                checkoutBtn.disabled = true;
                cartBadge.classList.add('hidden');
            } else {
                emptyCartMessage.style.display = 'none';
                checkoutBtn.disabled = false;
                cartBadge.classList.remove('hidden');

                carrito.forEach(item => {
                    const subtotal = item.precio * item.cantidad;
                    total += subtotal;
                    totalItems += item.cantidad;

                    const itemEl = document.createElement('div');
                    itemEl.className = 'flex items-center gap-4 bg-white p-3 rounded-xl border border-gray-100 shadow-sm';
                    itemEl.innerHTML = `
                        <div class="w-16 h-16 shrink-0 bg-white border border-gray-100 rounded-lg flex items-center justify-center p-1.5">
                            <img src="${item.url_imagen}" alt="${item.nombre}" class="w-full h-full object-contain">
                        </div>
                        <div class="flex-grow">
                            <h4 class="text-sm font-bold text-gray-800 line-clamp-1">${item.nombre}</h4>
                            <div class="text-olive-green font-semibold text-sm mb-1">$${item.precio.toFixed(2)}</div>
                            
                            <!-- Controles de Cantidad -->
                            <div class="flex items-center bg-gray-100 w-fit rounded-lg">
                                <button onclick="modificarCantidad(${item.id}, -1)" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:text-accent-orange hover:bg-gray-200 rounded-l-lg transition-colors">
                                    <i class="fa-solid fa-minus text-xs"></i>
                                </button>
                                <span class="w-8 text-center text-sm font-medium text-gray-800">${item.cantidad}</span>
                                <button onclick="modificarCantidad(${item.id}, 1)" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:text-accent-orange hover:bg-gray-200 rounded-r-lg transition-colors">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex flex-col items-end justify-between h-full">
                            <button onclick="eliminarDelCarrito(${item.id})" class="text-gray-400 hover:text-red-500 transition-colors p-1" title="Eliminar">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                            <span class="font-bold text-gray-900 text-sm mt-2">$${subtotal.toFixed(2)}</span>
                        </div>
                    `;
                    cartItemsContainer.appendChild(itemEl);
                });
            }

            // Actualizar Totales y Badges
            cartTotalEl.innerText = `$${total.toFixed(2)}`;
            cartBadge.innerText = totalItems;
        }

        /**
         * ==========================================
         * 5. MANEJO DE LA INTERFAZ (SIDEBAR)
         * ==========================================
         */
        function abrirCarrito() {
            cartSidebar.classList.add('open');
            cartOverlay.classList.add('open');
            body.classList.add('modal-open');
        }

        function cerrarCarrito() {
            cartSidebar.classList.remove('open');
            cartOverlay.classList.remove('open');
            // Solo remover si el modal de producto NO está abierto
            if (!productModal.classList.contains('open')) {
                body.classList.remove('modal-open');
            }
        }

        openCartBtn.addEventListener('click', abrirCarrito);
        closeCartBtn.addEventListener('click', cerrarCarrito);
        cartOverlay.addEventListener('click', cerrarCarrito);

        /**
         * ==========================================
         * 6. CHECKOUT Y WHATSAPP
         * ==========================================
         */
        function procesarCompraWhatsApp() {
            if (carrito.length === 0) return;

            let mensaje = "Hola Mister Vitaminas, quiero comprar los siguientes productos:\n\n";
            let totalGeneral = 0;

            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                totalGeneral += subtotal;
                
                // Formato requerido:
                // [Nombre del producto 1] - Cantidad: [X] - Valor: $[X] - Subtotal:$[X]
                mensaje += `${item.nombre} - Cantidad: ${item.cantidad} - Valor: $${item.precio.toFixed(2)} - Subtotal:$${subtotal.toFixed(2)}\n`;
            });

            mensaje += `\nTotal a pagar: $${totalGeneral.toFixed(2)}`;

            // Codificar mensaje para la URL
            const mensajeCodificado = encodeURIComponent(mensaje);
            
            // Generar enlace
            const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${mensajeCodificado}`;

            // Abrir en nueva pestaña
            window.open(urlWhatsApp, '_blank');
        }

        checkoutBtn.addEventListener('click', procesarCompraWhatsApp);

        /**
         * ==========================================
         * 7. INICIALIZACIÓN
         * ==========================================
         */
        // Renderizar productos al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            renderProductos();
            actualizarCarritoUI(); // Asegurar estado inicial vacío
        });

    </script>
</body>
</html>
